schema_version: 1
# Optional host hooks (CLI/platform >=1.5.0); paths relative to project root.
# hooks:
#   pre_install:
#     script: deploy/hooks/pre-install.sh
#     timeout_seconds: 300
#   post_install:
#     script: deploy/hooks/post-install.sh
#     timeout_seconds: 300
application: project-a

build:
  dockerfile: Dockerfile
  context: .
  # Optional: add ordinary build arguments after project onboarding.
  # args:
  #   BUILD_PROFILE: production
  #   FEATURE_ENABLED: 'true'

container:
  port: 8080
  host_port: 8080
  bind_address: 127.0.0.1

health:
  readiness_path: /health/ready
  startup_timeout_seconds: 120

resources:
  memory_limit: 512m
  cpus: 1.0

required_config:
  - DATABASE_URL
  - APP_SECRET
