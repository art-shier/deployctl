name: Standard SSH deployment

on:
  workflow_call:
    inputs:
      platform-repository:
        type: string
        required: true
      platform-ref:
        type: string
        required: true
      application:
        type: string
        required: true
      environment:
        type: string
        required: true
      release-url:
        type: string
        required: true
      sha256:
        type: string
        required: true
      mode:
        type: string
        default: upgrade
      runtime-env:
        description: Optional runtime KEY=value lines; persisted after successful deployment
        type: string
        default: ''
      install-params:
        description: Optional invocation-local hook KEY=value lines
        type: string
        default: ''
      ssh-port:
        type: number
        default: 22
      host-port:
        description: Optional host port for first install; zero means contract default
        type: number
        default: 0
      runner:
        type: string
        default: ubuntu-24.04
    secrets:
      PLATFORM_READ_TOKEN:
        required: false
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.application }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ inputs.platform-ref }}
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
          path: platform
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate inputs and download verified artifact
        env:
          PYTHONPATH: ${{ github.workspace }}/platform
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ inputs.release-url }}
          RELEASE_SHA256: ${{ inputs.sha256 }}
          APPLICATION: ${{ inputs.application }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh-port }}
          HOST_PORT: ${{ inputs.host-port }}
          RUNTIME_ENV: ${{ inputs.runtime-env }}
          INSTALL_PARAMS: ${{ inputs.install-params }}
        run: |
          python platform/scripts/prepare_deploy.py
      - name: Deploy using server-side deployctl
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh-port }}
          APPLICATION: ${{ inputs.application }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
          HOST_PORT: ${{ inputs.host-port }}
        run: |
          set -euo pipefail
          SSH_DIR=$(mktemp -d)
          trap 'rm -rf -- "$SSH_DIR"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          SSH_OPTIONS=(-i "$SSH_DIR/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_DIR/known_hosts")
          TARGET="$SSH_USER@$SSH_HOST"
          REMOTE_DIR=$(ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$TARGET" 'mktemp -d /tmp/deployctl.XXXXXXXXXX')
          [[ "$REMOTE_DIR" =~ ^/tmp/deployctl\.[A-Za-z0-9]+$ ]]
          trap 'ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$TARGET" "rm -rf -- $REMOTE_DIR" || true; rm -rf -- "$SSH_DIR"' EXIT
          scp "${SSH_OPTIONS[@]}" -P "$SSH_PORT" release.tar.gz release.tar.gz.sha256 parameters.json platform/scripts/deploy_remote.py "$TARGET:$REMOTE_DIR/"
          ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$TARGET" \
            "bash -s -- '$APPLICATION' '$TARGET_ENVIRONMENT' '$MODE' '$REMOTE_DIR' '$HOST_PORT'" <<'REMOTE'
          set -euo pipefail
          app=$1; environment=$2; mode=$3; directory=$4; host_port=$5
          args=("$mode" "$app" --env "$environment" --release "$directory/release.tar.gz")
          if [[ "$mode" == install && "$host_port" != 0 ]]; then
            args+=(--port "$host_port")
          fi
          python3 "$directory/deploy_remote.py" "$directory/parameters.json" "${args[@]}"
          deployctl status "$app" --env "$environment"
          REMOTE
