name: Shared verification
on:
  workflow_call:
    inputs:
      ref:
        description: Exact caller commit or requested release tag to verify
        type: string
        default: ''
permissions:
  contents: read
jobs:
  unit:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - run: python scripts/build_install_script.py --check
      - run: python scripts/build_release_assets.py
      - run: python -m unittest discover -s tests -v
      - name: Static deployment transactions on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p 'test_static_runtime.py' -v
      - run: python -I -S dist/deployctl.pyz validate templates/deployment.yaml
      - run: bash -n install.sh
      - name: Real local installation
        if: runner.os == 'Linux'
        run: bash scripts/installer_smoke.sh
  docker:
    name: Real Docker integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/docker_integration.py
      - name: Actual cold and cached image pull progress
        run: python scripts/docker_progress_smoke.py
      - name: Prepare build argument fixture with the release preparation script
        id: args
        run: python scripts/build_args_integration.py prepare --directory "$RUNNER_TEMP/build-args"
      - uses: docker/setup-buildx-action@v3
      - name: Verify argument transport through the actual release build action
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/build-args
          file: ${{ runner.temp }}/build-args/Dockerfile
          load: true
          tags: deployctl-build-args:test
          build-args: ${{ steps.args.outputs.build_args }}
      - run: python scripts/build_args_integration.py verify
