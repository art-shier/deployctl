name: Release deployctl

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag, e.g. v1.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ inputs.version || github.ref_name }}
  control-plane:
    uses: ./.github/workflows/control-plane.yml
    with:
      ref: ${{ inputs.version || github.ref_name }}
  publish:
    needs: [verify, control-plane]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 build
      - name: Verify tag and package version
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          from deployctl import __version__
          metadata = tomllib.loads(Path('pyproject.toml').read_text())
          if os.environ['TAG'] != 'v' + __version__ or metadata['project']['version'] != __version__:
              raise SystemExit('Tag, deployctl version and pyproject version must match')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Server image repository
        id: server-repository
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ctl-server" >> "$GITHUB_OUTPUT"
      - name: Build and push platform image
        id: server-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.server-repository.outputs.image }}:${{ inputs.version || github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ctl API and management console
      - name: Verify public image and build server bundle
        env:
          IMAGE: ${{ steps.server-repository.outputs.image }}@${{ steps.server-image.outputs.digest }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/anonymous-docker"
          docker --config "$RUNNER_TEMP/anonymous-docker" pull --platform linux/amd64 "$IMAGE"
          python scripts/build_server_bundle.py --image "$IMAGE" --version "$TAG"
      - name: Build wheel and release assets
        run: |
          python -m build --wheel
          python scripts/build_release_assets.py
          python -I -S dist/deployctl.pyz --version
          bash scripts/installer_smoke.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: deployctl-${{ inputs.version || github.ref_name }}
          path: dist/
          retention-days: 14
      - name: Stage draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" dist/deployctl.pyz dist/deployctl.pyz.sha256 \
            dist/install.sh dist/install.sh.sha256 dist/SHA256SUMS \
            dist/team-deploy-skill-*.zip dist/team-deploy-skill-*.zip.sha256 \
            dist/ctl-platform-*.tar.gz dist/ctl-platform-*.tar.gz.sha256 \
            dist/*.whl dist/*.whl.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --draft
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          releases = json.loads((Path(os.environ['RUNNER_TEMP']) / 'releases.json').read_text())
          matches = [item for item in releases if item['tag_name'] == os.environ['TAG'] and item['draft']]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one staged draft Release')
          print('RELEASE_ID=' + str(matches[0]['id']))
          PY
      - name: Verify actual private draft installation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          bash dist/install.sh --repo "$GITHUB_REPOSITORY" --version "$TAG" --release-id "$RELEASE_ID" --install-dir "$RUNNER_TEMP/installed"
          test "$("$RUNNER_TEMP/installed/ctl" --version)" = "${TAG#v}"
          test "$("$RUNNER_TEMP/installed/deployctl" --version)" = "${TAG#v}"
          gh api "repos/$GITHUB_REPOSITORY/contents/install.sh?ref=$TAG" \
            -H 'Accept: application/vnd.github.raw+json' \
            | bash -s -- --repo "$GITHUB_REPOSITORY" --version "$TAG" --release-id "$RELEASE_ID" --install-dir "$RUNNER_TEMP/one-click"
          test "$("$RUNNER_TEMP/one-click/ctl" --version)" = "${TAG#v}"
          "$RUNNER_TEMP/one-click/ctl" self-update --version "$TAG" --release-id "$RELEASE_ID"
          test "$("$RUNNER_TEMP/one-click/ctl" --version)" = "${TAG#v}"
          test "$("$RUNNER_TEMP/one-click/deployctl" --version)" = "${TAG#v}"
      - name: Install actual draft server bundle through ctl
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/server-draft"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ctl-platform-${TAG}.tar.gz*" --dir "$RUNNER_TEMP/server-draft"
          trap 'sudo docker compose --project-name ctl-platform --env-file /root/ctl-release-fixture/compose.env -f control-deploy/compose.yaml --profile database down || true' EXIT
          sudo "$RUNNER_TEMP/installed/ctl" server install --release "$RUNNER_TEMP/server-draft/ctl-platform-${TAG}.tar.gz" --home /root/ctl-release-fixture \
            --origin http://127.0.0.1:8092 --registry-host 127.0.0.1:5092 --api-port 8092 --registry-port 5092
          curl --fail --silent http://127.0.0.1:8092/api/v1/health/ready >/dev/null
          sudo "$RUNNER_TEMP/installed/ctl" server upgrade --release "$RUNNER_TEMP/server-draft/ctl-platform-${TAG}.tar.gz" --home /root/ctl-release-fixture
      - name: Publish verified Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$RUNNER_TEMP/anonymous-gh" \
            bash dist/install.sh --repo "$GITHUB_REPOSITORY" --version "$TAG" --install-dir "$RUNNER_TEMP/published"
          test "$("$RUNNER_TEMP/published/ctl" --version)" = "${TAG#v}"
          env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$RUNNER_TEMP/anonymous-gh" PATH="$RUNNER_TEMP/published:$PATH" ctl self-update
          test "$("$RUNNER_TEMP/published/ctl" --version)" = "${TAG#v}"
          test "$("$RUNNER_TEMP/published/deployctl" --version)" = "${TAG#v}"
          trap 'sudo docker compose --project-name ctl-platform --env-file /root/ctl-release-fixture/compose.env -f control-deploy/compose.yaml --profile database down || true' EXIT
          sudo "$RUNNER_TEMP/published/ctl" server-upgrade --home /root/ctl-release-fixture
          sudo "$RUNNER_TEMP/published/ctl" server-restart --home /root/ctl-release-fixture
          curl --fail --silent http://127.0.0.1:8092/api/v1/health/ready >/dev/null
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/ctl-platform-${TAG}.tar.gz"
          env -u GH_TOKEN -u GITHUB_TOKEN python - "$RELEASE_URL" <<'PY'
          import sys, tempfile
          from deployctl.download import acquire_release
          from deployctl.server_bundle import read_bundle
          with tempfile.TemporaryDirectory() as cache:
              manifest, _ = read_bundle(acquire_release(sys.argv[1], cache))
              print('Verified public server bundle:', manifest['version'], manifest['image'])
          PY
          echo "Server bundle: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Published $TAG after real GitHub asset download and installer verification" >> "$GITHUB_STEP_SUMMARY"
